name: agent-r9-doc-repair

on:
  push:
    branches:
      - agent/resolvent-stack-r0-r9

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resolvent-stack-r0-r9
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Repair public intra-doc links
        shell: python
        run: |
          from pathlib import Path
          p = Path("crates/solverang/src/integrate/mod.rs")
          text = p.read_text()
          replacements = [
              ("through the [`step`] module's [`Problem`](crate::problem::Problem) adapter — no", "through an internal [`Problem`](crate::problem::Problem) adapter — no"),
              ("bespoke Newton loop. A [PI (predictive) step-size controller](controller) provides", "bespoke Newton loop. A PI (predictive) step-size controller provides"),
              ("exactly [`IntegratorCoeffs::bdf`]", "exactly [`numeric_contracts::IntegratorCoeffs::bdf`]"),
              ("a seam [`NumericError`]", "a seam [`numeric_contracts::NumericError`]"),
              ("- **The event loop** ([`EventBearing`](numeric_contracts::EventBearing): crossing", "- **The event loop** (crossing"),
              ("//! use numeric_contracts::Ctx;", "//! use solverang_contracts::Ctx;"),
              ("implements numeric_contracts::DaeResidual<f64>", "implements solverang_contracts::DaeResidual<f64>"),
          ]
          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f"expected documentation target not found: {old!r}")
          if changed:
              p.write_text(text)
      - name: Format
        run: cargo fmt --all
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/solverang/src/integrate/mod.rs
          git commit -m "repair R9 public documentation links"
          git push origin HEAD:agent/resolvent-stack-r0-r9
