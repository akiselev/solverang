[package]
name = "solverang"
version = "0.1.0"
edition = "2021"
description = "Domain-agnostic numerical solver for nonlinear systems and least-squares problems"
license = "Apache-2.0"
repository = "https://github.com/akiselev/solverang"
readme = "../../README.md"
keywords = ["solver", "nonlinear", "least-squares", "constraints", "cad"]
categories = ["mathematics", "science", "algorithms"]
rust-version = "1.85"

[lib]
path = "src/lib.rs"

[features]
default = ["std", "macros"]
std = []
parallel = ["rayon"]
sparse = ["faer"]
macros = ["solverang_macros"]
jit = ["dep:anvil"]
nist = []

[dependencies]
nalgebra = "0.34"
levenberg-marquardt = "0.15"
thiserror = "2.0"

# Solverang owns the domain-neutral numerical seam. Keep the historical dependency key so
# existing integration code continues to import `numeric_contracts`, but the package is now
# portable and lives in this repository rather than at an absolute Sinbad checkout path.
numeric-contracts = { package = "solverang-contracts", path = "../contracts" }

rayon = { version = "1.10", optional = true }
faer = { version = "0.22", optional = true }
solverang_macros = { version = "0.1.0", path = "../macros", optional = true }

# Legacy JIT compatibility remains optional. The dependency is portable rather than an
# absolute checkout path; solver algorithms themselves depend only on solverang-contracts'
# target-neutral ExecutableResidual seam. Anvil should ultimately become its own package/repo.
anvil = { package = "sinbad-anvil", git = "https://github.com/akiselev/sinbad.git", rev = "f2ca939b6a9de16d8c0f5f4a7fada582f60a9af7", optional = true }

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "scaling"
harness = false

[[bench]]
name = "comprehensive"
harness = false

[[bench]]
name = "nist_benchmarks"
harness = false
required-features = ["nist"]

[[bench]]
name = "jit_benchmark"
harness = false
required-features = ["jit", "macros"]
