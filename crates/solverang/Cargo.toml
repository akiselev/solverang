[package]
name = "solverang"
version = "0.1.0"
edition = "2021"
description = "Domain-agnostic numerical solver for nonlinear systems and least-squares problems"
license = "Apache-2.0"
repository = "https://github.com/akiselev/solverang"
readme = "../../README.md"
keywords = ["solver", "nonlinear", "least-squares", "constraints", "cad"]
categories = ["mathematics", "science", "algorithms"]
rust-version = "1.85"

[lib]
path = "src/lib.rs"

[features]
default = ["std", "macros"]
std = []
parallel = ["rayon"]
sparse = ["faer"]
macros = ["solverang_macros"]
# Keep the historical JIT portable and self-contained during the R9 migration. Anvil may become
# an execution backend later, but Solverang must not acquire a reverse/path dependency on Sinbad.
jit = ["cranelift", "cranelift-jit", "cranelift-module", "cranelift-native"]
nist = []

[dependencies]
nalgebra = "0.34"
levenberg-marquardt = "0.15"
thiserror = "2.0"

# Solverang owns the domain-neutral numerical seam. Keep the historical dependency key so
# existing integration code continues to import `numeric_contracts`, but the package is now
# portable and lives in this repository rather than at an absolute Sinbad checkout path.
numeric-contracts = { package = "solverang-contracts", path = "../contracts" }

rayon = { version = "1.10", optional = true }
faer = { version = "0.22", optional = true }
solverang_macros = { version = "0.1.0", path = "../macros", optional = true }

# Portable historical JIT. Retained until an Anvil replacement has independent behavioral parity.
cranelift = { version = "0.116", optional = true }
cranelift-jit = { version = "0.116", optional = true }
cranelift-module = { version = "0.116", optional = true }
cranelift-native = { version = "0.116", optional = true }

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "scaling"
harness = false

[[bench]]
name = "comprehensive"
harness = false

[[bench]]
name = "nist_benchmarks"
harness = false
required-features = ["nist"]

[[bench]]
name = "jit_benchmark"
harness = false
required-features = ["jit", "macros"]